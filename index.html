<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéAPI - Pokedex</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer type="module"></script>
  </head>
  <body>
    <h1>Pokédex Interactif</h1>

    <h2>Sélectionner la génération de Pokémon :</h2>
    <section id="filtre">
      <div class="filter-group">
        <label for="generation-select">Génération :</label>
        <div class="select">
          <select id="generation-select">
            <option value="1">Génération 1</option>
            <option value="2">Génération 2</option>
            <option value="3">Génération 3</option>
            <option value="4">Génération 4</option>
            <option value="5">Génération 5</option>
            <option value="6">Génération 6</option>
            <option value="7">Génération 7</option>
            <option value="8">Génération 8</option>
          </select>
        </div>
      </div>

      <div class="filter-group">
        <label for="sort-select">Trier par :</label>
        <div class="select">
          <select id="sort-select">
            <option value="id">Numéro Pokédex</option>
            <option value="name">Nom</option>
            <option value="hp">Points de vie</option>
            <option value="attack">Attaque</option>
            <option value="type">Type</option>
          </select>
        </div>
      </div>
    </section>

    <div id="types"></div>

    <main></main>
  </body>
</html>
